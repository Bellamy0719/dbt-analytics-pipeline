version: 2

models:
  - name: stg_orders
    description: "Cleaned and standardized orders data with essential timestamps and delivery status"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Foreign key linking to stg_customers table"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: order_status
        description: "Current status of the order (only delivered or shipped)"

      - name: order_date
        description: "Date when the order was purchased"
        tests:
          - not_null

      - name: approved_date
        description: "Date when the payment was approved"

      - name: delivered_date
        description: "Date when the order was delivered to the customer"

  - name: stg_order_items
    description: "Standardized order items data with price and freight details"
    columns:
      - name: order_id
        description: "Foreign key linking to stg_orders table"
        tests:
          - not_null

      - name: product_id
        description: "Identifier of the product included in the order"
        tests:
          - not_null

      - name: price
        description: "Price of the individual product"
        tests:
          - not_null

      - name: freight_value
        description: "Freight cost associated with the order item"
        tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customer information table containing unique identifiers and location details"
    columns:
      - name: customer_id
        description: "Primary key for the customer (foreign key in orders table)"
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "Global unique identifier for customer across orders"
        tests:
          - not_null

      - name: customer_city
        description: "City where the customer is located"

      - name: customer_state
        description: "State where the customer is located"
